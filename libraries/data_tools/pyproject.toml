[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "application-data-tools"
version = "0.1.0"
description = "Optional bounded tabular data helpers for applications"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["application_data_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
