name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish immutable release
    runs-on: ubuntu-latest
    # Full lifecycle proof precedes both reproducible full/Node build passes.
    timeout-minutes: 90
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate

      - name: Validate tag and selected commit
        id: release
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$COMMIT" origin/main
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)", tag)
          if match is None:
              raise SystemExit(f"Unsupported release tag: {tag}")
          version = match.group(1)
          source_version = Path("VERSION").read_text(encoding="ascii").strip()
          if source_version != version:
              raise SystemExit(
                  f"Tag version {version!r} does not match VERSION {source_version!r}"
              )
          prerelease = version.partition("-")[2]
          channel = (
              "stable"
              if not prerelease
              else "test"
              if prerelease.split(".", 1)[0].lower() == "test"
              else "beta"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"channel={channel}", file=output)
          PY
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          test "$(git rev-list -n 1 "$TAG")" = "$COMMIT"
          echo "source_date_epoch=$(git show -s --format=%ct "$COMMIT")" >> "$GITHUB_OUTPUT"

      - name: Require green main CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          checked=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT" -f branch=main -f event=push -F per_page=100 \
            --jq '.workflow_runs | .[0] | select(.status == "completed" and .conclusion == "success") | .head_sha')
          if [[ "$checked" != "$COMMIT" ]]; then
            echo "The tagged commit must have a successful, completed main push CI run." >&2
            exit 1
          fi

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install locked compiled UI toolchain
        run: npm ci --prefix frontend/compiler --no-audit --no-fund

      - name: Verify frontend
        working-directory: frontend
        run: |
          pnpm run test:unit -- --run
          pnpm run type-check
          pnpm exec vue-tsc --project tsconfig.cap21.json
          pnpm exec vitest run --config ../modules/application-starter/tests/vitest.config.mjs --maxWorkers=1
          pnpm run build-only

      - name: Verify backend and release tooling
        env:
          PYTEST_ADDOPTS: --maxfail=1
          THREE_MM_CLIENT_TOOLCHAIN_ACCEPTANCE: "1"
        run: |
          python -m pip install --requirement backend/requirements-dev.txt
          python -m pytest -q tools/tests
          python -m pytest -q
          python -m pytest -q deployment/tests three_mm_application_sdk/tests

      - name: Export the exact tagged source
        env:
          COMMIT: ${{ github.sha }}
        run: git archive --format=tar --output "$RUNNER_TEMP/3mm-source.tar" "$COMMIT"

      - name: Set up Go for the ARMv6 compiler artifact
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.12"
          cache: false

      - name: Build release assets twice
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          common_args=(
            --source-archive "$RUNNER_TEMP/3mm-source.tar"
            --frontend-dist frontend/dist
            --dependencies-file deployment/release-dependencies.json
            --repository "$REPOSITORY"
            --version "$VERSION"
            --tag "$TAG"
            --commit "$COMMIT"
            --branch main
            --channel "$CHANNEL"
            --source-date-epoch "$SOURCE_DATE_EPOCH"
            --architecture aarch64
            --architecture armv7l
            --architecture x86_64
            --architecture armv6l
          )
          python deployment/armv6_ui_tools.py prepare "$RUNNER_TEMP/armv6-a"
          python deployment/armv6_ui_tools.py prepare "$RUNNER_TEMP/armv6-b"
          python deployment/build_release.py "${common_args[@]}" --armv6-ui-tools "$RUNNER_TEMP/armv6-a" --output-dir "$RUNNER_TEMP/release-a"
          python deployment/build_release.py "${common_args[@]}" --armv6-ui-tools "$RUNNER_TEMP/armv6-b" --output-dir "$RUNNER_TEMP/release-b"
          diff --recursive --brief "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"
          python deployment/prepare_node_wheels.py --output "$RUNNER_TEMP/node-wheels"
          node_args=(
            --source-root . --wheels "$RUNNER_TEMP/node-wheels"
            --version "$VERSION" --commit "$COMMIT" --repository "$REPOSITORY"
            --epoch "$SOURCE_DATE_EPOCH"
          )
          python deployment/build_node_release.py "${node_args[@]}" --output "$RUNNER_TEMP/release-a"
          python deployment/build_node_release.py "${node_args[@]}" --output "$RUNNER_TEMP/release-b"
          diff --recursive --brief "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"
          cd "$RUNNER_TEMP/release-a"
          sha256sum ./*.tar.gz ./3mm-update-manifest.json ./3mm-armv6-update-manifest.json ./3mm-node-manifest.json > SHA256SUMS

      - name: Confirm checkout remained clean
        run: git diff --exit-code

      - name: Publish complete draft and then make it visible
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -Eeuo pipefail
          release_flags=(--draft --verify-tag --title "3mm $VERSION")
          notes_file="docs/RELEASE_NOTES_$VERSION.md"
          if [[ -f "$notes_file" ]]; then
            release_flags+=(--notes-file "$notes_file")
          else
            release_flags+=(--generate-notes)
          fi
          if [[ "$CHANNEL" != "stable" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$TAG" "$RUNNER_TEMP/release-a/"* "${release_flags[@]}"
          gh release edit "$TAG" --draft=false
