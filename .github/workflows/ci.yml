name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
  CHECK_HEAD: ${{ github.sha }}
  # A failed run is never publishable; report its first failure promptly.
  # Successful runs still execute every selected test.
  PYTEST_ADDOPTS: --maxfail=1

jobs:
  plan:
    name: Select check groups
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.select.outputs.python }}
      frontend: ${{ steps.select.outputs.frontend }}
      tooling: ${{ steps.select.outputs.tooling }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select affected groups (manual/unknown base means full)
        id: select
        run: python tools/checks.py --base "$CHECK_BASE" --head "$CHECK_HEAD" --github-output "$GITHUB_OUTPUT"

  python:
    name: Python tests (Linux)
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Preserve broad POSIX integration coverage for production Python changes.
    timeout-minutes: 90
    steps:
      - name: Require a successful selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Check out repository
        if: needs.plan.outputs.python == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        if: needs.plan.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install test dependencies
        if: needs.plan.outputs.python == 'true'
        run: python -m pip install --requirement backend/requirements-dev.txt
      - name: Run selected Python suites
        if: needs.plan.outputs.python == 'true'
        run: python tools/checks.py --base "$CHECK_BASE" --head "$CHECK_HEAD" --run --only python
      - name: No Python changes
        if: needs.plan.outputs.python != 'true'
        run: echo "Python suites are not required by this change."

  frontend:
    name: Frontend checks
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a successful selection
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = success
      - name: Check out repository
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: needs.plan.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        if: needs.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
      - name: Install locked dependencies
        if: needs.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        if: needs.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm run test:unit -- --run
      - name: Run TypeScript check
        if: needs.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm run type-check
      - name: Build production frontend
        if: needs.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: pnpm run build-only
      - name: No frontend changes
        if: needs.plan.outputs.frontend != 'true'
        run: echo "Frontend checks are not required by this change."

  tooling:
    name: Development tooling checks
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tooling validation dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt
      - run: python -m pytest -q tools/tests
