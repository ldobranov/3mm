<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3mm device setup</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --body-bg: #fff; --card-bg: #fff; --panel-bg: #f8fafc;
        --text: #222; --muted: #666; --border: #d1d5db;
        --primary: #007bff; --header-bg: #4caf50; --header-text: #fff; --radius: 8px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--body-bg); color: var(--text); }
      header { padding: .9rem max(1rem, calc((100% - 38rem) / 2)); background: var(--header-bg); color: var(--header-text); font-weight: 750; }
      main { width: min(100% - 1.5rem, 38rem); margin: 0 auto; padding: 1.5rem 0 2.5rem; }
      h1 { margin: 0 0 .35rem; font-size: clamp(1.6rem, 7vw, 2rem); }
      .intro { margin: 0 0 1.25rem; color: var(--muted); }
      form { display: grid; gap: 1rem; padding: clamp(1rem, 4vw, 1.5rem); border: 1px solid var(--border); border-radius: var(--radius); background: var(--card-bg); }
      label { display: grid; gap: .4rem; min-width: 0; font-size: .9rem; font-weight: 650; }
      input, select, button { width: 100%; min-width: 0; padding: .72rem .8rem; border: 1px solid var(--border); border-radius: max(4px, calc(var(--radius) * .65)); background: var(--card-bg); color: var(--text); font: inherit; }
      input:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      button { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .network-picker { display: grid; gap: .55rem; padding: .75rem; border-radius: var(--radius); background: var(--panel-bg); }
      .network-toolbar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
      .network-toolbar strong { font-size: .9rem; }
      .scan-button { width: auto; padding: .45rem .7rem; background: transparent; color: var(--primary); }
      .network-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .45rem; }
      .network-option { display: flex; justify-content: space-between; gap: .5rem; padding: .55rem .65rem; overflow: hidden; background: var(--card-bg); color: var(--text); border-color: var(--border); font-size: .82rem; font-weight: 600; text-align: left; }
      .network-option span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .network-option span:last-child { flex: 0 0 auto; color: var(--muted); font-size: .75rem; }
      .network-note, #status { min-height: 1.25rem; margin: 0; color: var(--muted); font-size: .82rem; }
      #status[data-error="true"] { color: #dc2626; }
      @media (max-width: 420px) {
        main { width: min(100% - 1rem, 38rem); padding-top: 1rem; }
        .network-list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>Mega Monitor · Device setup</header>
    <main>
      <h1>Set up this 3mm device</h1>
      <p class="intro">Choose a Wi-Fi network and configure the device.</p>
      <form id="setup-form">
        <div class="network-picker">
          <div class="network-toolbar">
            <strong>Available Wi-Fi networks</strong>
            <button type="button" class="scan-button" id="scan-networks">Refresh</button>
          </div>
          <div id="network-list" class="network-list"></div>
          <p id="network-status" class="network-note" aria-live="polite">Loading nearby networks…</p>
        </div>
        <label>Network name <input id="network-name" name="network_name" maxlength="32" required autocomplete="off"></label>
        <label>Network passphrase <input name="passphrase" type="password" minlength="8" maxlength="63" required autocomplete="new-password"></label>
        <label>Device name <input name="device_name" value="3mm-device" maxlength="63" required></label>
        <label>Locale <input name="locale" value="en-US" maxlength="35" required></label>
        <label>Administrator name <input name="administrator_name" value="admin" maxlength="64" required></label>
        <label>Role
          <select name="role">
            <option value="standalone">Standalone</option>
            <option value="hub">Hub / Server</option>
            <option value="node">Node / Client</option>
          </select>
        </label>
        <label>Hub address (Node only) <input name="hub_endpoint" type="url" placeholder="https://hub.local"></label>
        <button type="submit">Apply setup</button>
        <output id="status" aria-live="polite"></output>
      </form>
    </main>
    <script>
      const root = document.documentElement;
      const form = document.querySelector('#setup-form');
      const status = document.querySelector('#status');
      const networkName = document.querySelector('#network-name');
      const networkList = document.querySelector('#network-list');
      const networkStatus = document.querySelector('#network-status');
      const scanButton = document.querySelector('#scan-networks');
      const submitButton = form.querySelector('button[type="submit"]');

      function showReconnectMessage(network) {
        status.dataset.error = 'false';
        status.textContent = `Setup saved. Connect to “${network}” and reopen Mega Monitor. If the setup network remains available, check the password and try again.`;
      }

      async function loadTheme() {
        try {
          const response = await fetch('/api/v1/setup/theme');
          if (!response.ok) return;
          const theme = await response.json();
          const values = {
            '--body-bg': theme.body_bg, '--card-bg': theme.card_bg,
            '--panel-bg': theme.panel_bg, '--text': theme.text_primary,
            '--muted': theme.text_secondary, '--border': theme.border,
            '--primary': theme.primary, '--header-bg': theme.header_bg,
            '--header-text': theme.header_text, '--radius': `${theme.border_radius}px`,
          };
          for (const [name, value] of Object.entries(values)) root.style.setProperty(name, value);
          root.style.colorScheme = theme.mode;
        } catch (_) {}
      }

      async function scanNetworks() {
        scanButton.disabled = true;
        networkStatus.textContent = 'Loading nearby networks…';
        networkList.replaceChildren();
        try {
          const response = await fetch('/api/v1/setup/networks');
          if (!response.ok) throw new Error('scan failed');
          const result = await response.json();
          for (const network of result.items) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'network-option';
            const name = document.createElement('span');
            name.textContent = network.network_name;
            const details = document.createElement('span');
            details.textContent = `${network.secured ? '🔒 ' : ''}${network.signal}%`;
            button.append(name, details);
            button.addEventListener('click', () => {
              networkName.value = network.network_name;
              networkName.focus();
            });
            networkList.append(button);
          }
          networkStatus.textContent = result.items.length
            ? 'Select a network above or enter a hidden network manually.'
            : 'No cached networks found. Enter the network name manually.';
        } catch (_) {
          networkStatus.textContent = 'Networks could not be loaded. Enter the network name manually.';
        } finally {
          scanButton.disabled = false;
        }
      }

      scanButton.addEventListener('click', scanNetworks);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        status.dataset.error = 'false';
        status.textContent = 'Applying setup…';
        const values = Object.fromEntries(new FormData(form).entries());
        if (!values.hub_endpoint) delete values.hub_endpoint;
        let response;
        try {
          response = await fetch('/api/v1/setup/configure', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(values),
          });
        } catch (_) {
          showReconnectMessage(values.network_name);
          submitButton.disabled = false;
          return;
        }

        if (!response.ok) {
          status.dataset.error = 'true';
          status.textContent = 'Setup was rejected. Check the fields and try again.';
          submitButton.disabled = false;
          return;
        }

        try {
          const outcome = await response.json();
          if (!outcome.recovery_required) {
            showReconnectMessage(values.network_name);
          } else if (outcome.recovery_required) {
            status.dataset.error = 'true';
            status.textContent = 'Connection failed. Setup mode is still available.';
            submitButton.disabled = false;
          }
        } catch (_) {
          showReconnectMessage(values.network_name);
          submitButton.disabled = false;
        }
      });

      loadTheme();
      scanNetworks();
    </script>
  </body>
</html>
